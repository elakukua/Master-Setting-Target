<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — National Target Dashboard · Wahana Visi Indonesia</title>
<meta name="color-scheme" content="light">

<link rel="stylesheet" href="assets/app.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='app.css';document.head.appendChild(l);">
<link rel="stylesheet" href="assets/a11y-patch.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='a11y-patch.css';document.head.appendChild(l);">
<link rel="stylesheet" href="assets/overview.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='overview.css';document.head.appendChild(l);">

<style>
body{margin:0;background:#F7F7F9;
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:.5px solid #E4E4EA;padding:18px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 18px}
.mark{width:26px;height:26px;border-radius:6px;background:#FF5515;flex:0 0 auto}
.brand b{font-size:13px;font-weight:600;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;padding:8px 10px;border-radius:6px;font-size:12px;color:#5E5C6A;text-decoration:none}
.nav a:hover{background:#F2F2F5}
.nav a[aria-current="page"]{background:#FFF0EA;color:#B33A0C;font-weight:500}
.main{padding:20px 24px 40px;max-width:1180px}
.hd h1{font-size:19px;font-weight:600;margin:0}
.hd p{font-size:12px;color:#6E6C7A;margin:2px 0 18px}
.skiplink{position:absolute;left:-9999px}
.skiplink:focus{left:8px;top:8px;background:#111222;color:#fff;padding:8px 14px;font-size:12px;z-index:99}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:.5px solid #E4E4EA}}
@media print{.side,.hd p{display:none}.main{max-width:none;padding:0}@page{size:A4 landscape;margin:12mm}}
</style>
</head>
<body>
<a class="skiplink" href="#ov">Lompat ke isi</a>
<div class="wrap">

<aside class="side">
  <div class="brand"><div class="mark"></div><b>National Target<br>Dashboard</b></div>
  <nav class="nav" aria-label="Bagian dashboard">
    <a href="#" aria-current="page">Overview</a>
    <a href="index.html">Workbook lengkap</a>
  </nav>
</aside>

<main class="main">
  <div class="hd">
    <h1>Overview</h1>
    <p>AIM+ target setting FY27&ndash;FY30 &middot; weighted national</p>
  </div>
  <div id="ov" tabindex="-1">
    <p style="font-size:12px;color:#6E6C7A">Memuat data indikator&hellip;</p>
  </div>
</main>

</div>

<script>
(function(){
  var Q=[["data/config.js","config.js"],["data/indicators.js","indicators.js"],
         ["data/asumsi.js","asumsi.js"],["data/pemetaan.js","pemetaan.js"],
         ["data/master.js","master.js"],
         ["assets/overview.js","overview.js"]];
  var failed=[];
  function one(c,done){var i=0;(function t(){
    if(i>=c.length){done(false);return;}
    var s=document.createElement("script");s.src=c[i++];s.async=false;
    s.onload=function(){done(true);};
    s.onerror=function(){s.parentNode&&s.parentNode.removeChild(s);t();};
    document.head.appendChild(s);})();}
  function next(n){
    if(n>=Q.length){fin();return;}
    one(Q[n],function(ok){
      /* Berkas data yang tidak ada tidak fatal - modul akan melaporkan sendiri
         kalau global yang dibutuhkan ternyata kosong. Hanya overview.js wajib. */
      if(!ok) failed.push(Q[n][0].replace(/^.*\//,""));
      next(n+1);
    });
  }
  function fin(){
    var host=document.getElementById("ov");
    if(typeof WVIOverview==="undefined"){
      host.innerHTML='<div class="wvo"><div class="wvo-fail"><b>assets/overview.js tidak termuat.</b>'+
        '<p>Berkas yang tidak ditemukan: <code>'+(failed.join("</code> <code>")||"-")+'</code></p></div></div>';
      return;
    }
    function run(){ WVIOverview.render(host); }
    if(document.readyState==="loading")
      document.addEventListener("DOMContentLoaded",run,{once:true});
    else run();
  }
  next(0);
})();
</script>
</body>
</html>
