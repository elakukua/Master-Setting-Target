<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIM+ Target Setting · Wahana Visi Indonesia</title>
<meta name="description" content="SUMMARY dan ANALISIS AP untuk penetapan target Area Programme, siklus AIM+ FY27–FY30. PEARL, Wahana Visi Indonesia.">
<meta name="color-scheme" content="light">
<style>
  #boot{font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#3F3D4C;padding:34px 26px;max-width:720px}
  #boot h2{font-size:17px;color:#111222;margin:0 0 10px}
  #boot code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#F3F2F0;padding:1px 5px;border-radius:2px}
  #boot .bad{color:#B10831;font-weight:600}
</style>
<link rel="stylesheet" href="assets/app.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='app.css';document.head.appendChild(l);">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111222'/%3E%3Crect x='5' y='22' width='5' height='5' fill='%23FF5515'/%3E%3Crect x='13' y='15' width='5' height='12' fill='%23FF5515'/%3E%3Crect x='21' y='7' width='5' height='20' fill='%23155930'/%3E%3C/svg%3E">
</head>
<body>

<!-- Logo: taruh file resmi WVI sebagai assets/logo.svg atau assets/logo.png -->
<header class="wvhead">
  <div class="wvhead-in">
    <div class="brand">
      <img id="wvLogo" class="logo" alt="World Vision" hidden>
      <div class="lock">
        <span class="org">Wahana Visi Indonesia</span>
        <span class="sub">PEARL &nbsp;·&nbsp; AIM+ Target Setting &nbsp;·&nbsp; FY27–FY30</span>
      </div>
    </div>
    <div class="wvhead-sp"></div>
    <span class="chip" id="dataChip">memuat…</span>
    <nav class="tools">
      <button class="cbtn" id="btnSave" title="Unduh file data untuk di-commit ke repository">⤒ Simpan file data</button>
      <button class="cbtn" id="btnCsv" title="Unduh tabel sesuai filter, siap dibuka di Excel">⤓ CSV</button>
      <button class="cbtn" id="btnPrint">⎙ Cetak</button>
      <button class="cbtn" id="btnReset" title="Buang perubahan lokal, muat ulang data repository">↺ Reset</button>
    </nav>
  </div>
</header>

<div class="sheetwrap" id="sheets">
  <div id="boot"><h2>Memuat…</h2><p>Membaca konfigurasi, data submission, asumsi, dan pemetaan indikator.</p></div>
</div>

<div class="tabbar noprint"><div class="tabbar-in" id="tabbar"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var Q=[["data/config.js","config.js"],["data/indicators.js","indicators.js"],
         ["data/asumsi.js","asumsi.js"],["data/pemetaan.js","pemetaan.js"],
         ["assets/app.js","app.js"]];
  var found=[],failed=[];
  function one(c,done){var i=0;(function t(){
    if(i>=c.length){done(false);return;}
    var s=document.createElement("script");s.src=c[i++];s.async=false;
    s.onload=function(){found.push(s.src);done(true);};
    s.onerror=function(){s.parentNode&&s.parentNode.removeChild(s);t();};
    document.head.appendChild(s);})();}
  function next(n){ if(n>=Q.length){fin();return;}
    one(Q[n],function(ok){ if(!ok) failed.push(Q[n][0].replace(/^.*\//,"")); next(n+1); }); }
  function fin(){
    if(failed.length) return rep();
    if(typeof boot!=="function") return rep("app.js termuat tapi tidak mendefinisikan boot()");
    if(document.readyState==="loading") return;
    try{ boot(); }catch(e){ rep(e.message); }
  }
  function rep(x){
    var el=document.getElementById("boot"); if(!el)return;
    el.innerHTML='<h2>Ada file yang tidak ditemukan</h2>'+
      '<p>Halaman mencari tiap file di <code>data/</code> dan <code>assets/</code> lebih dulu, '+
      'lalu di root repository. Yang tidak ada di keduanya:</p><ul>'+
      failed.map(function(f){return '<li class="bad">'+f+'</li>';}).join('')+'</ul>'+
      '<p>Yang berhasil dimuat:</p><ul>'+(found.length?found.map(function(f){
        return '<li><code>'+f+'</code></li>';}).join(''):'<li>tidak ada</li>')+'</ul>'+
      '<p>Periksa apakah semuanya sudah ter-commit dan namanya tidak kebawa tambahan '+
      '<code> (1)</code> dari unduhan browser.</p>'+(x?'<p class="bad">'+x+'</p>':'');
  }
  next(0);
})();
</script>
</body>
</html>
